<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naia CMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#faf6f3;color:#4a3838;padding:20px}
.c{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:900px;margin:0 auto}
input,button{font-family:inherit;font-size:14px;padding:10px;border:1px solid #e8ddd8;border-radius:8px}
button{cursor:pointer;background:#9b6a6d;color:#fff;border:none;padding:10px 20px}
button:hover{opacity:.85}
.b2{background:#fff;color:#4a3838;border:1px solid #e8ddd8}
.b3{background:#c97070}
.pi{background:#fff;padding:16px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid #e8ddd8;display:flex;justify-content:space-between;align-items:center}
.pi:hover{border-color:#9b6a6d}
.bg{font-size:11px;padding:2px 8px;border-radius:20px}
.be{background:#e8f5e9;color:#2e7d32}
.bo{background:#f5f0ed;color:#8a7878}
.tb{margin:10px 0;display:flex;gap:4px;flex-wrap:wrap}
.tb button{padding:6px 12px;font-size:13px}
#ed{background:#fff;min-height:500px;padding:20px;border:1px solid #e8ddd8;border-radius:8px;outline:none}
#ed:focus{border-color:#9b6a6d}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0}
.it{cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;aspect-ratio:1}
.it:hover{border-color:#9b6a6d}
.it img{width:100%;height:100%;object-fit:cover}
.md{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999}
.md.show{display:flex}
.mb{background:#fff;border-radius:10px;padding:20px;width:600px;max-width:90vw;max-height:80vh;overflow-y:auto}
.ul{border:2px dashed #e8ddd8;border-radius:8px;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px}
.ul input{display:none}
.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4a3838;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.ts.show{opacity:1}
</style>
</head>
<body>
<div id="login" class="c" style="max-width:360px;margin-top:15vh">
<h1 style="color:#9b6a6d;margin-bottom:8px">Naia CMS</h1>
<p style="color:#8a7878;margin-bottom:20px;font-size:14px">Upri se da menjas sadrzaj sajta.</p>
<input type="password" id="pw" placeholder="Lozinka" style="width:100%;margin-bottom:12px">
<button style="width:100%" onclick="login()">Upri se</button>
<div id="le" style="color:#c97070;font-size:14px;margin-top:8px"></div>
</div>
<div id="app" style="display:none">
<div style="background:#fff;border-bottom:1px solid #e8ddd8;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 20px">
<b style="color:#9b6a6d">Naia CMS</b>
<div>
<a href="/" target="_blank"><button class="b2" style="font-size:13px;padding:6px 14px">Otvori sajt</button></a>
<button class="b2" style="font-size:13px;padding:6px 14px" onclick="logout()">Odjava</button>
</div>
</div>
<div class="c">
<div style="font-size:16px;margin-bottom:16px">Izaberi stranicu:</div>
<div id="pages"></div>
</div>
</div>
<div id="editor" style="display:none">
<div style="background:#fff;border-bottom:1px solid #e8ddd8;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;max-width:900px;margin:0 auto">
<div id="ename"></div>
<div>
<button class="b2" style="font-size:13px;padding:6px 14px" onclick="showImg()">Slika</button>
<button class="b3" style="font-size:13px;padding:6px 14px" onclick="resetPg()">Vrati na original</button>
<button class="b2" style="font-size:13px;padding:6px 14px" onclick="back()">Nazad</button>
<button style="font-size:13px;padding:6px 14px" onclick="save()" id="sb">Sacuvaj</button>
</div>
</div>
<div class="tb" style="max-width:900px;margin:0 auto">
<button class="b2" onclick="fmt('bold')"><b>B</b></button>
<button class="b2" onclick="fmt('italic')"><i>I</i></button>
<button class="b2" onclick="fmt('underline')"><u>U</u></button>
<button class="b2" onclick="fmt('formatBlock','H1')">H1</button>
<button class="b2" onclick="fmt('formatBlock','H2')">H2</button>
<button class="b2" onclick="fmt('formatBlock','H3')">H3</button>
<button class="b2" onclick="fmt('formatBlock','P')">P</button>
<button class="b2" onclick="addLink()">Link</button>
<button class="b2" onclick="showImg()">Slika</button>
<button class="b2" onclick="fmt('insertUnorderedList')">Lista</button>
<button class="b2" onclick="fmt('undo')">Undo</button>
<button class="b2" onclick="fmt('redo')">Redo</button>
</div>
<div style="padding:20px;max-width:900px;margin:0 auto">
<div id="ed" contenteditable="true"></div>
</div>
</div>
<div class="md" id="imgmd">
<div class="mb">
<h2 style="color:#9b6a6d;margin-bottom:12px">Slike</h2>
<div class="ul" onclick="document.getElementById('uf').click()">
<p style="color:#8a7878;font-size:14px">Klikni da ucitas novu sliku</p>
<input type="file" id="uf" accept="image/*" onchange="upImg(event)">
</div>
<div id="ig" class="ig"></div>
<div style="text-align:right"><button class="b2" onclick="closeImg()">Zatvori</button></div>
</div>
</div>
<div class="ts" id="toast"></div>
<script>
var cp='',ph='';
document.addEventListener('DOMContentLoaded',checkAuth);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
async function checkAuth(){try{var r=await fetch('/api/verify',{credentials:'include'});var d=await r.json();if(d.authed)showApp();}catch(e){}}
async function login(){var p=document.getElementById('pw').value;var e=document.getElementById('le');e.textContent='';try{var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({password:p})});var d=await r.json();if(r.ok)showApp();else e.textContent=d.error||'Greska';}catch(ex){e.textContent='Greska';}}
function logout(){document.cookie='naia_auth=;Path=/;Max-Age=0';location.reload();}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadPages();}
async function loadPages(){var el=document.getElementById('pages');el.innerHTML='Ucitavanje...';try{var r=await fetch('/api/pages',{credentials:'include'});var d=await r.json();el.innerHTML=d.pages.map(function(p){return '<div class="pi" onclick="edit(\''+p.path+'\',\''+p.name+'\')"><div>'+p.name+'<br><small style="color:#8a7878">'+p.path+'</small></div><span class="bg '+(p.edited?'be':'bo')+'">'+(p.edited?'Izmenjeno':'Original')+'</span></div>';}).join('');}catch(e){el.innerHTML='Greska';}}
async function edit(path,name){cp=path;document.getElementById('app').style.display='none';document.getElementById('editor').style.display='block';document.getElementById('ename').textContent=name;var ed=document.getElementById('ed');ed.innerHTML='Ucitavanje...';try{var r=await fetch('/api/page?path='+encodeURIComponent(path),{credentials:'include'});var d=await r.json();var doc=new DOMParser().parseFromString(d.html,'text/html');ph=doc.head.innerHTML;ed.innerHTML=doc.body.innerHTML;}catch(e){ed.innerHTML='Greska';}}
function back(){document.getElementById('editor').style.display='none';document.getElementById('app').style.display='block';loadPages();}
function fmt(c,v){document.getElementById('ed').focus();document.execCommand(c,false,v||null);}
function addLink(){var u=prompt('Unesi URL:');if(u)fmt('createLink',u);}
async function save(){var b=document.getElementById('sb');b.textContent='Cuvanje...';try{var body=document.getElementById('ed').innerHTML;var html='<!DOCTYPE html><html lang="sr"><head>'+ph+'</head><body>'+body+'</body></html>';var r=await fetch('/api/page',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({path:cp,html:html})});var d=await r.json();if(r.ok)toast('Sacuvano!');else toast(d.error||'Greska');}catch(e){toast('Greska');}b.textContent='Sacuvaj';}
async function resetPg(){if(!confirm('Vrati na original?'))return;try{await fetch('/api/page?path='+encodeURIComponent(cp),{method:'DELETE',credentials:'include'});toast('Vraceno');back();}catch(e){toast('Greska');}}
function showImg(){document.getElementById('imgmd').classList.add('show');loadImgs();}
function closeImg(){document.getElementById('imgmd').classList.remove('show');}
async function loadImgs(){var g=document.getElementById('ig');g.innerHTML='Ucitavanje...';try{var r=await fetch('/api/images',{credentials:'include'});var d=await r.json();if(d.images.length===0){g.innerHTML='Nema slika.';return;}g.innerHTML=d.images.map(function(img){return '<div class="it"><img src="'+img.url+'" loading="lazy" onclick="insImg(\''+img.url+'\')"></div>';}).join('');}catch(e){g.innerHTML='Greska';}}
async function upImg(ev){var f=ev.target.files[0];if(!f)return;var g=document.getElementById('ig');g.innerHTML='Ucitavanje...';var fd=new FormData();fd.append('file',f);try{var r=await fetch('/api/upload',{method:'POST',credentials:'include',body:fd});var d=await r.json();if(r.ok){toast('Ucitano');loadImgs();}else{toast(d.error||'Greska');loadImgs();}}catch(e){toast('Greska');loadImgs();}}
function insImg(u){fmt('insertImage',u);closeImg();toast('Ubaceno');}
var tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='ts show';clearTimeout(tt);tt=setTimeout(function(){e.className='ts';},3000);}
</script>
</body>
</html>
